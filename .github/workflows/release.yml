name: release

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest,     target: linux-x64,    ext: ""    }
          - { os: ubuntu-24.04-arm,  target: linux-arm64,  ext: ""    }
          - { os: macos-latest,      target: macos-arm64,  ext: ""    }
          - { os: windows-latest,    target: windows-x64,  ext: ".exe"}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: dart-lang/setup-dart@65eb853c7ba17dde3be364c3d2858773e7144260 # v1.7.2
      - run: dart pub get
      - name: Compile
        shell: bash
        run: |
          dart compile exe bin/knot.dart -o knot${{ matrix.ext }}
      - name: Strip (POSIX)
        if: runner.os != 'Windows'
        run: strip knot
      - name: Package
        id: package
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          NAME="knot-${VERSION}-${{ matrix.target }}"
          if [ "${{ runner.os }}" = "Windows" ]; then
            7z a "${NAME}.zip" knot.exe
            echo "artifact=${NAME}.zip" >> "$GITHUB_OUTPUT"
          else
            tar czf "${NAME}.tar.gz" knot
            echo "artifact=${NAME}.tar.gz" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/attest-build-provenance@a2bbfa25375fe432b6a289bc6b6cd05ecd0c4c32 # v4.1.0
        with:
          subject-path: ${{ steps.package.outputs.artifact }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.package.outputs.artifact }}
          path: ${{ steps.package.outputs.artifact }}

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        run: |
          cd dist
          sha256sum * > SHA256SUMS
      - uses: softprops/action-gh-release@b4309332981a82ec1c5618f44dd2e27cc8bfbfda # v3.0.0
        with:
          files: |
            dist/*
